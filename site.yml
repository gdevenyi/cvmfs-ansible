---
# site.yml — Install and configure CVMFS + Lmod on Ubuntu or Debian
# Usage:
#   ansible-playbook site.yml -i <HOST>,
#   ansible-playbook site.yml --check -i <HOST>,   (dry-run)
- name: Configure CVMFS and Lmod
  hosts: all
  become: true
  gather_facts: true

  vars:
    supported_ubuntu_versions:
      - "22.04"
      - "24.04"
      - "26.04"
    supported_debian_versions:
      - "11"
      - "12"
      - "13"
    # Ubuntu 22.04 and Debian 11 ship Lmod 6.6, whose spider-cache writer
    # mis-escapes Alliance/Neurodesk modulefile metadata and emits a cache
    # Lmod then chokes on. Those targets read no cache (LMOD_IGNORE_CACHE,
    # set in cvmfs_modules.sh.j2) and build none.
    lmod_cache_writer_broken: >-
      {{ (ansible_facts["distribution"] == 'Ubuntu'
          and ansible_facts["distribution_version"] == '22.04')
         or (ansible_facts["distribution"] == 'Debian'
             and ansible_facts["distribution_major_version"] == '11') }}
    # Apptainer GitHub release pin (used on Debian; Ubuntu uses the PPA).
    # The `-trixie+` variant pins against Debian-13-or-newer libc/libfuse.
    apptainer_version: "1.5.0"
    apptainer_deb_variant: >-
      {{ '-trixie+'
         if (ansible_facts["distribution"] == 'Debian'
             and ansible_facts["distribution_major_version"] | int >= 13)
         else '' }}
    apptainer_deb_base: https://github.com/apptainer/apptainer/releases/download
    apptainer_deb_url: >-
      {{ apptainer_deb_base }}/v{{ apptainer_version }}/apptainer_{{ apptainer_version }}{{ apptainer_deb_variant }}_amd64.deb

  tasks:
    # ---------------------------------------------------------------
    # 0. Supported-target guard
    # ---------------------------------------------------------------
    # Fail fast on unsupported hosts so misuse surfaces here rather than
    # deep inside an apt task with a confusing error.
    - name: Assert target is a supported Ubuntu or Debian release
      ansible.builtin.assert:
        that:
          - (ansible_facts["distribution"] == 'Ubuntu' and ansible_facts["distribution_version"] in supported_ubuntu_versions)
            or (ansible_facts["distribution"] == 'Debian' and ansible_facts["distribution_major_version"] in supported_debian_versions)
        fail_msg: >-
          Unsupported target: {{ ansible_facts["distribution"] }} {{ ansible_facts["distribution_version"] }}.
          Supported: Ubuntu {{ supported_ubuntu_versions | join(', ') }};
          Debian {{ supported_debian_versions | join(', ') }}.
        success_msg: "Target {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }} is supported."

    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    # ---------------------------------------------------------------
    # 1. Prerequisites
    # ---------------------------------------------------------------
    - name: Install prerequisite packages
      ansible.builtin.apt:
        name: "{{ prereq_packages }}"
        state: present
        update_cache: true
      vars:
        # fuse3, not fuse: the cvmfs package on every supported target depends
        # on cvmfs-fuse3/libfuse3, and fuse3 Provides/Replaces fuse. Asking
        # for fuse (2.x) would evict a preinstalled fuse3 (Ubuntu cloud
        # images) or fail outright where other packages need fuse3.
        # software-properties-common is the PPA dependency, only used on Ubuntu.
        prereq_packages: >-
          {{
            ['fuse3', 'autofs', 'wget', 'lsb-release']
            + (['software-properties-common'] if ansible_facts["distribution"] == 'Ubuntu' else [])
          }}

    - name: Ensure FUSE kernel module is loaded
      community.general.modprobe:
        name: fuse
        state: present

    # ---------------------------------------------------------------
    # 2. CVMFS Client
    # ---------------------------------------------------------------
    - name: Download CVMFS release package
      # cvmrepo.s3.cern.ch hosts a fresher cvmfs-release than the
      # ecsft.cern.ch/dist/ tree.
      ansible.builtin.get_url:
        url: https://cvmrepo.s3.cern.ch/cvmrepo/apt/cvmfs-release-latest_all.deb
        dest: /tmp/cvmfs-release-latest_all.deb
        mode: "0644"
      when:
        - not ansible_check_mode
        - ansible_facts.packages['cvmfs-release'] is not defined

    - name: Install CVMFS release package
      ansible.builtin.apt:
        deb: /tmp/cvmfs-release-latest_all.deb
      register: _cvmfs_release_install
      when:
        - not ansible_check_mode
        - ansible_facts.packages['cvmfs-release'] is not defined

    - name: Update apt cache after adding CVMFS repo
      ansible.builtin.apt:
        update_cache: true
      when:
        - not ansible_check_mode
        - _cvmfs_release_install is defined and _cvmfs_release_install is changed

    - name: Install cvmfs package
      ansible.builtin.apt:
        name: cvmfs
        state: present
      when: not ansible_check_mode

    - name: Run cvmfs_config setup (configure autofs)
      ansible.builtin.command: cvmfs_config setup
      args:
        creates: /etc/auto.master.d/cvmfs.autofs
      when: not ansible_check_mode

    - name: Remove CVMFS release deb
      ansible.builtin.file:
        path: /tmp/cvmfs-release-latest_all.deb
        state: absent
      when: not ansible_check_mode

    # A cvmfs package upgrade runs cvmfs-reload.service, which hot-reloads the
    # Fuse module of every mounted repository in place. That reload sometimes
    # kills the cvmfs2 process instead of restoring it — seen on the
    # 2.13.3 -> 2.14.1 upgrade, where cvmfs-config.cern.ch logged
    # "Executable path: /usr/bin/cvmfs2 (deleted) / Failed to kill cvmfs
    # client!" and dumped core. The autofs mountpoint outlives the corpse, so
    # every access returns ENOTCONN and autofs will not remount it: the kernel
    # still lists the path as mounted.
    #
    # When the casualty is the config repository, the repositories that draw
    # their keys and CVMFS_SERVER_URL from it lose that configuration, and
    # chksetup fails with "no public keys in /etc/cvmfs/keys" and "required
    # parameter CVMFS_SERVER_URL undefined for soft.computecanada.ca" — even
    # though the repository itself is still mounted and readable.
    #
    # Unmounting the dead endpoint is the entire repair. This sits right after
    # the package tasks so it also cleans up after an upgrade that happened
    # outside this playbook (a fleet-wide dist-upgrade, unattended-upgrades).
    - name: Find stale CVMFS mounts (dead Fuse endpoints)
      ansible.builtin.shell: |
        set -o pipefail
        awk '$1 == "cvmfs2" && $2 ~ "^/cvmfs/" { print $2 }' /proc/mounts |
          while read -r mountpoint; do
              # A dead endpoint fails stat with ENOTCONN. The timeout covers
              # the other failure shape, a mount that hangs instead of erroring.
              timeout 10 stat "$mountpoint" >/dev/null 2>&1 || echo "$mountpoint"
          done
      args:
        executable: /bin/bash
      register: _cvmfs_stale_mounts
      changed_when: false
      when: not ansible_check_mode

    # --lazy rather than a plain umount: a dead endpoint has nothing left to
    # flush, and lazy detaches it even when a user process still holds a
    # reference, which a plain umount would refuse with EBUSY.
    - name: Unmount stale CVMFS mounts
      ansible.builtin.command: umount --lazy {{ item }}
      # The loop only ever contains mountpoints the previous task found dead,
      # so reaching this task at all means something was repaired.
      changed_when: true
      loop: "{{ _cvmfs_stale_mounts.stdout_lines | default([]) }}"
      when: not ansible_check_mode

    - name: Remount repaired CVMFS mounts through autofs
      ansible.builtin.command: ls {{ item }}
      changed_when: false
      loop: "{{ _cvmfs_stale_mounts.stdout_lines | default([]) }}"
      when: not ansible_check_mode

    # ---------------------------------------------------------------
    # 3. CVMFS Configuration
    # ---------------------------------------------------------------
    - name: Deploy /etc/cvmfs/default.local
      ansible.builtin.template:
        src: default.local.j2
        dest: /etc/cvmfs/default.local
        owner: root
        group: root
        mode: "0644"
      notify: Reload autofs

    # cvmfs_config setup writes a bare /etc/auto.master.d/cvmfs.autofs; we
    # re-template it to add the autofs idle-unmount timeout so CVMFS stays
    # mounted instead of being unmounted after the 5-minute default.
    - name: Deploy CVMFS autofs master entry (idle-unmount timeout)
      ansible.builtin.template:
        src: cvmfs.autofs.j2
        dest: /etc/auto.master.d/cvmfs.autofs
        owner: root
        group: root
        mode: "0644"
      notify: Reload autofs

    - name: Create Neurodesk key directory
      ansible.builtin.file:
        path: /etc/cvmfs/keys/ardc.edu.au
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy Neurodesk public key
      ansible.builtin.template:
        src: neurodesk.key.j2
        dest: /etc/cvmfs/keys/ardc.edu.au/neurodesk.ardc.edu.au.pub
        owner: root
        group: root
        mode: "0644"
      notify: Reload autofs

    - name: Create config.d directory
      ansible.builtin.file:
        path: /etc/cvmfs/config.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy Neurodesk repository config
      ansible.builtin.template:
        src: neurodesk.conf.j2
        dest: /etc/cvmfs/config.d/neurodesk.ardc.edu.au.conf
        owner: root
        group: root
        mode: "0644"
      notify: Reload autofs

    # ---------------------------------------------------------------
    # 4. Lmod
    # ---------------------------------------------------------------
    - name: Install Lmod
      ansible.builtin.apt:
        name: lmod
        state: present
      when: not ansible_check_mode

    # /usr/share/lmod/lmod is a packaging-guaranteed symlink to the installed
    # versioned Lmod directory on the Ubuntu and Debian lmod debs, so we stat
    # through it instead of scanning the filesystem. Using the symlink lets
    # module.sh.j2 hard-code the path and survive Lmod version bumps with no
    # playbook change.
    - name: Verify Lmod bash init script exists
      ansible.builtin.stat:
        path: /usr/share/lmod/lmod/init/bash
      register: _lmod_init
      failed_when: not _lmod_init.stat.exists
      when: not ansible_check_mode

    - name: Deploy /usr/share/module.sh
      ansible.builtin.template:
        src: module.sh.j2
        dest: /usr/share/module.sh
        owner: root
        group: root
        mode: "0644"
      when: not ansible_check_mode

    - name: Verify Lmod profile.d symlink exists
      ansible.builtin.stat:
        path: /etc/profile.d/lmod.sh
      register: _lmod_profile
      failed_when: not _lmod_profile.stat.exists
      when: not ansible_check_mode

    # ---------------------------------------------------------------
    # 5. Apptainer (required by Neurodesk container workflows)
    # ---------------------------------------------------------------
    # Two install paths:
    #   - Ubuntu: PPA via deb822_repository + signed-by keyring fetched
    #     over HTTPS. `apt_repository: ppa:...` is avoided because its
    #     hkp-based key import is unreliable on newer Ubuntu.
    #   - Debian: upstream GitHub release deb (the PPA is Launchpad-only
    #     and has no Debian pocket).
    - name: Install Apptainer from PPA (Ubuntu)
      when: ansible_facts["distribution"] == 'Ubuntu'
      block:
        - name: Ensure /etc/apt/keyrings exists
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Fetch Apptainer PPA signing key
          ansible.builtin.get_url:
            url: https://keyserver.ubuntu.com/pks/lookup?op=get&search=0xF6B0F5193D4F3301EF491FF0AFE36534FC6218AE
            dest: /etc/apt/keyrings/apptainer.asc
            owner: root
            group: root
            mode: "0644"
          when: not ansible_check_mode

        - name: Add Apptainer PPA
          ansible.builtin.deb822_repository:
            name: apptainer
            types: deb
            uris: https://ppa.launchpadcontent.net/apptainer/ppa/ubuntu
            suites: "{{ ansible_facts['distribution_release'] }}"
            components: main
            signed_by: /etc/apt/keyrings/apptainer.asc
            state: present
          register: _apptainer_repo
          when: not ansible_check_mode

        - name: Update apt cache after adding Apptainer PPA
          ansible.builtin.apt:
            update_cache: true
          when:
            - not ansible_check_mode
            - _apptainer_repo is defined and _apptainer_repo is changed

        - name: Install Apptainer (Ubuntu)
          ansible.builtin.apt:
            name: apptainer
            state: present
          when: not ansible_check_mode

    - name: Install Apptainer from GitHub release (Debian)
      when: ansible_facts["distribution"] == 'Debian'
      block:
        - name: Download Apptainer .deb
          ansible.builtin.get_url:
            url: "{{ apptainer_deb_url }}"
            dest: /tmp/apptainer.deb
            mode: "0644"
          when:
            - not ansible_check_mode
            - ansible_facts.packages['apptainer'] is not defined

        - name: Install Apptainer .deb
          ansible.builtin.apt:
            deb: /tmp/apptainer.deb
          when:
            - not ansible_check_mode
            - ansible_facts.packages['apptainer'] is not defined

        - name: Remove Apptainer .deb
          ansible.builtin.file:
            path: /tmp/apptainer.deb
            state: absent
          when: not ansible_check_mode

    # ---------------------------------------------------------------
    # 6. Module Integration
    # ---------------------------------------------------------------
    # The dest is named `zz-cvmfs-modules.sh` so /etc/profile.d sources it
    # AFTER lmod.sh. See the comment at the top of the template for the
    # Ubuntu 22.04 reason.
    - name: Deploy /etc/profile.d/zz-cvmfs-modules.sh
      ansible.builtin.template:
        src: cvmfs_modules.sh.j2
        dest: /etc/profile.d/zz-cvmfs-modules.sh
        owner: root
        group: root
        mode: "0755"
      register: _cvmfs_modules_profile

    - name: Remove old /etc/profile.d/cvmfs_modules.sh (pre-rename installs)
      ansible.builtin.file:
        path: /etc/profile.d/cvmfs_modules.sh
        state: absent

    - name: Add module system init to /etc/bash.bashrc
      ansible.builtin.blockinfile:
        path: /etc/bash.bashrc
        marker: "# {mark} ANSIBLE MANAGED - CVMFS modules"
        block: |
          if [ -f '/usr/share/module.sh' ]; then
              . /usr/share/module.sh
          fi
          if [ -f '/etc/profile.d/zz-cvmfs-modules.sh' ]; then
              . /etc/profile.d/zz-cvmfs-modules.sh
          fi

    # ---------------------------------------------------------------
    # 7. Verification
    # ---------------------------------------------------------------
    - name: Flush handlers (reload autofs if needed)
      ansible.builtin.meta: flush_handlers
      when: not ansible_check_mode

    - name: Verify CVMFS configuration (chksetup)
      ansible.builtin.command: cvmfs_config chksetup
      changed_when: false
      when: not ansible_check_mode

    - name: Verify CVMFS connectivity
      ansible.builtin.command: cvmfs_config probe {{ item }}
      register: _cvmfs_probe
      changed_when: false
      retries: 6
      delay: 10
      until: _cvmfs_probe is succeeded
      loop: "{{ cvmfs_repositories }}"
      when: not ansible_check_mode

    - name: Verify CVMFS mounts
      ansible.builtin.command: ls /cvmfs/{{ item }}
      changed_when: false
      loop: "{{ cvmfs_repositories }}"
      when: not ansible_check_mode

    - name: Verify Apptainer is installed and runnable
      ansible.builtin.command: apptainer --version
      changed_when: false
      when: not ansible_check_mode

    # ---------------------------------------------------------------
    # 8. Lmod spider cache
    # ---------------------------------------------------------------
    # `module spider` walks both module trees in full — measured on a test VM
    # that is ~21s cold and ~17s warm, and it leaves a 9MB private index in
    # the calling user's ~/.cache/lmod. A system-wide spider cache brings that
    # to ~1.3s, shares one index across users, and refreshes hourly instead of
    # the 24h Lmod keeps a user cache. (`module avail` only walks the
    # MODULEPATH directories themselves and is fast either way.)
    # This sits after verification so the first build runs against
    # repositories already known to be mounted.
    # https://lmod.readthedocs.io/en/latest/130_spider_cache.html
    - name: Configure the Lmod spider cache
      # `| bool` on both: either can arrive as a string from -e / an
      # inventory var, and Ansible rejects non-boolean conditionals.
      when:
        - lmod_spider_cache_enabled | bool
        - not (lmod_cache_writer_broken | bool)
      block:
        - name: Create Lmod spider cache directory
          ansible.builtin.file:
            path: "{{ lmod_spider_cache_dir }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Create Lmod configuration directory
          ansible.builtin.file:
            path: /etc/lmod
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Deploy Lmod spider cache files
          ansible.builtin.template:
            src: "{{ item.src }}"
            dest: "{{ item.dest }}"
            owner: root
            group: root
            mode: "{{ item.mode }}"
          loop:
            - src: lmodrc.lua.j2
              dest: /etc/lmod/lmodrc.lua
              mode: "0644"
            - src: update-lmod-spider-cache.j2
              dest: /usr/local/sbin/update-lmod-spider-cache
              mode: "0755"
            - src: lmod-spider-cache.service.j2
              dest: /etc/systemd/system/lmod-spider-cache.service
              mode: "0644"
            - src: lmod-spider-cache.timer.j2
              dest: /etc/systemd/system/lmod-spider-cache.timer
              mode: "0644"
          register: _lmod_cache_files

        - name: Enable the Lmod spider cache refresh timer
          ansible.builtin.systemd:
            name: lmod-spider-cache.timer
            daemon_reload: true
            enabled: true
            state: started
          when: not ansible_check_mode

        - name: Check whether the Lmod spider cache has been built
          ansible.builtin.stat:
            path: "{{ lmod_spider_cache_dir }}/spiderT.lua"
          register: _lmod_spider_cache

        # The cache is a build artifact, not a config file: rebuild it when it
        # is missing or when something that defines its contents changed,
        # rather than on every run. The timer keeps it fresh from then on.
        - name: Build the Lmod spider cache
          ansible.builtin.command: /usr/local/sbin/update-lmod-spider-cache
          changed_when: true
          when:
            - not ansible_check_mode
            - not _lmod_spider_cache.stat.exists
              or _lmod_cache_files is changed
              or _cvmfs_modules_profile is changed

        # Proves the cache is wired up, not merely present: Lmod only reports
        # a cache directory when it actually read scDescriptT from an lmodrc
        # it looks at.
        - name: Verify Lmod reads the system spider cache
          ansible.builtin.shell: |
            set -o pipefail
            . /usr/share/lmod/lmod/init/bash
            module --config 2>&1 | grep -q '{{ lmod_spider_cache_dir }}'
          args:
            executable: /bin/bash
          changed_when: false
          when: not ansible_check_mode

    # Turning the feature off — or landing on a target whose Lmod cannot use
    # a cache — has to undo it. Otherwise an hourly timer keeps refreshing a
    # cache nothing reads, or Lmod keeps serving listings from one nothing
    # refreshes.
    - name: Remove the Lmod spider cache
      when: not (lmod_spider_cache_enabled | bool) or (lmod_cache_writer_broken | bool)
      block:
        - name: Check for the Lmod spider cache timer unit
          ansible.builtin.stat:
            path: /etc/systemd/system/lmod-spider-cache.timer
          register: _lmod_cache_timer_unit

        - name: Disable the Lmod spider cache refresh timer
          ansible.builtin.systemd:
            name: lmod-spider-cache.timer
            enabled: false
            state: stopped
          when:
            - not ansible_check_mode
            - _lmod_cache_timer_unit.stat.exists

        - name: Remove Lmod spider cache files
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/lmod/lmodrc.lua
            - /usr/local/sbin/update-lmod-spider-cache
            - /etc/systemd/system/lmod-spider-cache.timer
            - /etc/systemd/system/lmod-spider-cache.service
            - "{{ lmod_spider_cache_dir }}"
          register: _lmod_cache_removed

        - name: Reload systemd after removing the spider cache units
          ansible.builtin.systemd:
            daemon_reload: true
          when:
            - not ansible_check_mode
            - _lmod_cache_removed is changed

  handlers:
    - name: Reload autofs
      ansible.builtin.systemd:
        name: autofs
        state: reloaded
      when: not ansible_check_mode
